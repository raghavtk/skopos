name: CI
on:
  push:
  pull_request:
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
  bpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev
      - run: make bpf
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build -o /tmp/skopos-agent ./cmd/skopos-agent
